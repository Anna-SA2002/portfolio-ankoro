<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>sato anna | music playlist</title>

    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="stylesheet" href="./src/css/style-music.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/css/page-editorial.css" />
    <link rel="stylesheet" href="./src/css/music-columns.css" />
  </head>

  <body class="page-editorial page-music">
    <svg class="music-ink-filter" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <filter id="music-ink" color-interpolation-filters="sRGB">
          <feFlood flood-color="#3C4248" result="ink" />
          <feComposite in="ink" in2="SourceAlpha" operator="in" />
        </filter>
      </defs>
    </svg>
    <canvas id="pixel-morse-background" aria-hidden="true"></canvas>

    <aside class="works-sidebar" aria-label="サイトナビゲーション">
      <span class="works-site-title">sato anna | portfolio</span>
      <nav class="works-breadcrumb" aria-label="現在位置">
        <a href="index.html">home</a><span aria-hidden="true">〉</span><a href="music-playlist.html" aria-current="page">music</a>
      </nav>
      <nav class="works-menu" aria-label="メインナビゲーション">
        <ul>
          <li><a href="works.html">wroks</a></li>
          <li><a href="about.html">about</a></li>
          <li><a href="music-playlist.html" aria-current="page" aria-label="音楽プレイリスト">music</a></li>
        </ul>
      </nav>
    </aside>
    <header class="header-container">
      <div class="logo">
        <a href="index.html">sato anna</a>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">home</a></li>
          <li><a href="works.html">works</a></li>
          <li><a href="about.html">about</a></li>
          <li><a href="music-playlist.html" aria-current="page" aria-label="音楽プレイリスト">music</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <h1 class="music-visually-hidden">Music playlist</h1>
      <div class="music-playlist-image">
        <img src="./public/assets/img/illustration/web-inner/music-figma.png" alt="ヘッドホンで音楽を聴く猫耳の女の子" width="600" height="600" />
      </div>
      <section class="music-listening" aria-label="音楽プレイリスト">
        <div id="spotify-player" class="spotify-embed-wrapper"></div>
        <p class="music-last-updated" id="playlist-updated"></p>
        <div class="music-palette-scroll" role="region" aria-label="曲のカラーボックス" tabindex="0">
          <div class="music-track-list" id="track-rows-container" role="group" aria-label="曲を選択"></div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
    <script type="module" src="./src/js/pixel-morse-background.js"></script>
    <script type="module" src="./src/js/music-playlist.js"></script>
    <script type="module" src="./src/js/breadcrumb-typing.js"></script>
  </body>
</html>
